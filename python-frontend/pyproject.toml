[project]
name = "meetily"
version = "0.1.0"
description = "Privacy-first AI meeting assistant - Desktop app"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "soundfile>=0.12",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "webrtcvad>=2.0.10",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyinstaller",
]

[project.scripts]
meetily = "meetily.main:main"
