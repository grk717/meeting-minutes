[project]
name = "meetily"
version = "0.1.0"
description = "Privacy-first AI meeting assistant - Desktop app"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyinstaller",
]

[project.scripts]
meetily = "meetily.main:main"
